name: education
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  shared_preferences: ^2.2.3
  flutter_tts: ^4.1.0
  speech_to_text: ^7.0.0
  confetti: ^0.7.0
  google_fonts: ^6.2.0
  video_player: ^2.8.6
  audioplayers: ^6.7.1
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/appicon.jpg"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - assets/vedios/
    - assets/audio/


